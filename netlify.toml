[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sanity connection (Phase 1, once the Sanity project exists):
# SANITY_PROJECT_ID, SANITY_DATASET, SANITY_API_TOKEN
# Set these in Netlify's Site settings → Environment variables, not here.

# Security headers. The CSP allowlist below covers Paystack's checkout,
# Google Fonts, Sanity's image CDN, and every ad/analytics platform wired
# through Google Tag Manager (see src/components/Analytics.astro and
# src/lib/tracking.ts) — GTM injects these platforms' own scripts directly
# into the page, so the browser's CSP applies to them same as anything
# else, GTM sitting in between doesn't exempt them. 'unsafe-inline' is kept
# on script-src and style-src because the JSON-LD structured-data <script>
# tags, GTM's own inline bootstrap snippet, and one inline
# style="width:.." attribute (the batch-progress bar) would otherwise be
# blocked — a nonce-based approach would remove the need for this but
# requires per-request generation, which doesn't fit the site's
# static-prerendered pages cleanly.
#
# MAINTENANCE NOTE: adding a new tag inside GTM's own dashboard (a new
# platform beyond the ones already listed here) does NOT need a code
# change on its own, but if that platform's script/beacon domain isn't
# already in this list, the browser will silently block it — confirmed
# live THREE times now, each round catching real traffic the previous
# round missed:
#   1. GTM's own script + Paystack's button stylesheet, before GTM/
#      tracking existed in the codebase at all.
#   2. GA4/Google Ads' actual measurement traffic once GTM was live
#      (stats.g.doubleclick.net, www.google.com, country-TLD variants
#      like google.com.ng) — needed img-src too, not just connect-src.
#   3. Meta, LinkedIn, and TikTok once THEY were configured in GTM and
#      actually firing: Meta sends a form-POST beacon to
#      www.facebook.com/tr/ (blocked by form-action, a directive nothing
#      here had touched before) and tries to frame facebook.com;
#      LinkedIn's pixel-sync redirect hits www.linkedin.com itself, not
#      just px.ads.linkedin.com; TikTok's IPv6 enrichment call goes to
#      analytics-ipv6.tiktokw.us — a completely different domain family
#      from analytics.tiktok.com, undocumented in TikTok's own basic
#      setup guide.
# Each platform's REAL traffic keeps using more domains/directives than
# its own base "add this script tag" instructions mention. If a tag still
# doesn't fire after this, check the browser console for the exact
# blocked URL and directive rather than assuming the domain list above is
# now complete — evidence has beaten prediction at every round so far.
#
# KNOWN GAP: CSP wildcards only match subdomains, not different top-level
# domains — *.google.com does NOT cover google.com.ng, google.co.uk, or
# other country-code variants Google Ads' remarketing-audience pixel uses
# depending on visitor location. Core measurement (page views, conversions)
# goes through google-analytics.com/doubleclick.net and works regardless;
# only that one supplementary remarketing-audience signal may still be
# blocked for visitors on a non-.com Google domain. Enumerating every
# country TLD isn't practical — flagging as an accepted, minor gap rather
# than silently pretending it's fully solved.
#
# IMPORTANT: verify the full checkout flow (Pay Now → Paystack popup →
# completed test payment) still works after this deploys. CSP is the one
# header here with real potential to silently break Paystack or tracking
# if any of these domains change.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co https://checkout.paystack.com https://*.googletagmanager.com https://*.google-analytics.com https://*.doubleclick.net https://*.googleadservices.com https://*.googlesyndication.com https://connect.facebook.net https://*.tiktokw.us https://analytics.tiktok.com https://s.pinimg.com https://snap.licdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://paystack.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io https://www.facebook.com https://ct.pinterest.com https://px.ads.linkedin.com https://www.linkedin.com https://*.google-analytics.com https://*.googletagmanager.com https://*.doubleclick.net https://*.google.com; connect-src 'self' https://api.paystack.co https://*.googletagmanager.com https://*.google-analytics.com https://*.doubleclick.net https://*.google.com https://www.facebook.com https://*.tiktokw.us https://analytics.tiktok.com https://ct.pinterest.com https://px.ads.linkedin.com; frame-src https://checkout.paystack.com https://js.paystack.co https://*.doubleclick.net https://www.facebook.com; base-uri 'self'; form-action 'self' https://www.facebook.com; frame-ancestors 'none'"
